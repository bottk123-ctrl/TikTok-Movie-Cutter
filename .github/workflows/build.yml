name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Быстрая проверка: синтаксис всех модулей и ошибки уровня F (неопределённые имена и т.п.).
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all modules
        run: python -m compileall -q .
      - name: Ruff (только ошибки)
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 .

  # Полная проверка сборки .exe на Windows.
  build-exe:
    runs-on: windows-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # torch в exe не входит, поэтому ставим только нужное (без faster-qwen3-tts и torch).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper "requests>=2.31.0" "yt-dlp>=2024.0.0" "customtkinter>=5.2.0" "pyinstaller>=6.0.0"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm TikTokMovieCutter.spec

      - name: Verify exe exists
        shell: pwsh
        run: |
          $exe = "dist\TikTokMovieCutter\TikTokMovieCutter.exe"
          if (-not (Test-Path $exe)) { throw "exe не собран: $exe" }
          Write-Host "OK: $exe"
          Write-Host ("Размер, МБ: " + [math]::Round((Get-ChildItem dist\TikTokMovieCutter -Recurse | Measure-Object Length -Sum).Sum/1MB,1))

      - name: Pack artifact
        shell: pwsh
        run: Compress-Archive -Path dist\TikTokMovieCutter\* -DestinationPath TikTokMovieCutter-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TikTokMovieCutter-windows
          path: TikTokMovieCutter-windows.zip
          retention-days: 14

  # Релиз: только при пуше тега v*. Прикладывает zip к GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TikTokMovieCutter-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: TikTokMovieCutter-windows.zip
          generate_release_notes: true
